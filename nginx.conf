server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;
    
    client_max_body_size 100000M;

    client_body_buffer_size 100000M;
    client_body_timeout 60s;

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
	add_header Content-Security-Policy "upgrade-insecure-requests" always;
    }

    # location /api/ {
    #     proxy_pass http://backend:8001/;
    #    # proxy_set_header Host $host;
    #    # proxy_set_header X-Real-IP $remote_addr;
	# proxy_set_header X-Forwarded-Proto https;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Host $host;
    #     proxy_set_header Host $host;

    #     proxy_connect_timeout 60s;
    #     proxy_send_timeout 60s;
    #     proxy_read_timeout 60s;
        
       
    # }
    location /api/ {
    proxy_pass http://backend:8001/;
    
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    
    # Буферизация с большими буферами для больших ответов
    proxy_buffering on;
    proxy_buffer_size 128k;
    proxy_buffers 16 512k;
    proxy_busy_buffers_size 512k;
    proxy_temp_file_write_size 512k;
    proxy_max_temp_file_size 0;  # не использовать временные файлы, если ответ влезает в буферы
    
    # Таймауты для долгих запросов
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    
    # Важно: указываем HTTP/1.1 для корректной работы keepalive и chunked encoding
    proxy_http_version 1.1;
    proxy_set_header Connection "";
}

    location ~ /\. {
        deny all;
    }
}
